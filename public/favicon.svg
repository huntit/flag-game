<?xml version="1.0" encoding="UTF-8"?>
<!-- Flag app mark. Drawn to survive a 16px browser tab: the pennant runs edge
     to edge with no dead margin, the pole is thick enough to hold a whole pixel
     column, and there is one bold shape rather than two similar-value bands
     that merge into mush when the icon is scaled down.

     Both seat colours are here and each does a distinct job: the ground is the
     P1 teal darkened until the P2 terracotta pops off it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#2F5A51"/>
  <rect x="16" y="11" width="14" height="78" rx="7" fill="#F7F1E8"/>
  <path fill="#D9744E" d="M30 19 C57 4 73 30 98 14 L98 63 C73 79 57 52 30 67 Z"/>
</svg>
