<?xml version="1.0" encoding="UTF-8"?>
<!-- Back of a Flag tile. The same cream stock, bevel and hairline edge as a
     face-up tile, so it reads as the same piece turned over — printed plain.
     A motif competed with the letters beside it and, at the size the score
     cards use, washed out into a grey square indistinguishable from an empty
     slot. A solid panel in the game's slate reads at 21px and at 49px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="stock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2C3A3D" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Tile stock: identical cream to a face-up tile. -->
  <rect width="100" height="100" rx="12" fill="#FDF9F2"/>

  <!-- The printed back. The cream margin around it is what says "tile". -->
  <rect x="17" y="17" width="66" height="66" rx="8" fill="#5B7A92"/>

  <!-- Same sheen and hairline edge the face-up tiles carry. -->
  <rect width="100" height="100" rx="12" fill="url(#stock)"/>
  <rect x="0.6" y="0.6" width="98.8" height="98.8" rx="11.5" fill="none"
        stroke="#2C3A3D" stroke-opacity="0.22" stroke-width="1.4"/>
</svg>
