<?xml version="1.0" encoding="UTF-8"?>
<!-- Back of a Flag tile. Deliberately the SAME piece as a face-up tile: same
     cream stock, same bevel, same top highlight, same hairline edge. Only the
     printing differs — the game's pennant where a letter would be, at roughly
     the weight of a letter, so a face-down tile reads as a tile rather than as
     an empty slot. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="stock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2C3A3D" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Tile stock: identical cream to a face-up tile. -->
  <rect width="100" height="100" rx="12" fill="#FDF9F2"/>

  <!-- Printed panel, the way a real tile back carries a pattern. -->
  <rect x="10" y="10" width="80" height="80" rx="8" fill="#5B7A92" opacity="0.13"/>
  <rect x="10" y="10" width="80" height="80" rx="8" fill="none" stroke="#5B7A92"
        stroke-width="2" opacity="0.42"/>

  <!-- Pennant, sized like a letter so the tile has the same visual weight
       face down as face up. -->
  <g fill="#5B7A92" opacity="0.85">
    <rect x="28" y="24" width="6.5" height="52" rx="3.25"/>
    <circle cx="31.25" cy="22" r="5"/>
    <path d="M36 28 C50 21 62 33 76 26.5 L70.5 46 C57 52.5 45 41 36 47 Z"/>
  </g>

  <!-- Same sheen and hairline edge the face-up tiles carry. -->
  <rect width="100" height="100" rx="12" fill="url(#stock)"/>
  <rect x="0.6" y="0.6" width="98.8" height="98.8" rx="11.5" fill="none"
        stroke="#2C3A3D" stroke-opacity="0.2" stroke-width="1.2"/>
</svg>
