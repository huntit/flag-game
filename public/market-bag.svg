<?xml version="1.0" encoding="UTF-8"?>
<!-- Tile bag. One clean silhouette so it still reads at 50px: full round body,
     gathered neck, a small tied knot. The remaining count is UI text beside
     the bag, not a badge stamped on the art. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <!-- Body: gathered at the neck, full and round below. -->
  <path fill="#7594AC"
        d="M31 46 C19 66 13 92 19 114 C25 136 42 146 60 146 C78 146 95 136 101 114
           C107 92 101 66 89 46 Z"/>
  <path fill="#FFFFFF" opacity="0.2"
        d="M42 58 C32 84 34 114 50 132 C41 106 40 78 48 56 Z"/>
  <path fill="#2C3A3D" opacity="0.14"
        d="M60 146 C78 146 95 136 101 114 C95 130 80 141 60 142 Z"/>

  <!-- Neck: a band tied above the shoulders of the bag. -->
  <path fill="#547292" d="M28 34 C46 46 74 46 92 34 L89 52 C72 61 48 61 31 52 Z"/>
  <path fill="#2C3A3D" opacity="0.2" d="M31 52 C48 61 72 61 89 52 L88 57 C71 65 49 65 32 57 Z"/>

  <!-- A small knot, so the neck reads as drawn closed. -->
  <g fill="none" stroke="#2C3A3D" stroke-width="4" stroke-linecap="round" opacity="0.72">
    <path d="M52 30 C44 22 50 13 58 19"/>
    <path d="M68 30 C76 22 70 13 62 19"/>
  </g>
</svg>
